name: aholo3d-rhino
version: 0.2.0-alpha.34
authors:
  - CuriousArc
  - qrost
description: >-
  Create worlds and objects, view Gaussian scenes and render through Aholo3D
  from Rhino. Includes World and Lux3D workflows, local static mesh placement,
  experimental GS viewing, USD/USDZ exchange and a separate cloud preview.
  Cloud services require a regional API Key and may consume credits; optional
  OAuth sign-in does not replace the key. English and Simplified Chinese.
  Preview for Rhino 8.32+ with .NET 8; native Windows and latest UI verification
  remain pending. Independent plugin by CuriousArc and qrost.
icon: icon.png
url: https://github.com/QROST/aholo3d-rhino
