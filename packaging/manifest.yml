name: aholo-rhino
version: 0.1.0-beta.1
authors:
  - CuriousArc
  - qrost
description: >-
  Aholo for Rhino by CuriousArc and qrost. Generate worlds from text or one
  image, preserve original PLY/SPZ assets, preview colored splat centers
  as native Rhino point clouds, and submit selected meshes/surfaces for
  offline RenderCloud rendering. Independent integration requiring Rhino
  8.32+, .NET 8 Runtime and an international Aholo API Key. Local development
  preview: live account and Rhino host acceptance remain pending. Point
  cloud previews do not reproduce full Gaussian splat appearance.
url: https://github.com/QROST
