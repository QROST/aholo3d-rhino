name: build-test-and-stage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Check public documentation and source hygiene
        run: python scripts/check-public-release.py
      - name: Test source publication preparation
        run: python scripts/test-public-release.py
      - name: Restore
        run: dotnet restore Aholo3D.sln
      - name: Build
        run: dotnet build Aholo3D.sln -c Release --no-restore
      - name: Test including hostless plug-in metadata
        run: dotnet test Aholo3D.sln -c Release --no-build
      - name: Verify product rename and installation recovery offline
        run: python scripts/test-product-rename.py
      - name: Verify regional contract snapshots
        run: python scripts/check-region-contracts.py
      - name: Verify account coordination across processes (synthetic storage)
        run: python fixtures/oauth-coordinator-verify.py
      - name: Verify mesh topology and shading geometry oracles
        run: python fixtures/mesh-shading-verify.py --geometry-only
      - name: Verify GS antialias compensation independently
        run: python fixtures/gaussian-antialias-verify.py
      - name: Verify reproducible textured 3MF fixture
        run: python fixtures/create-textured-3mf.py --check
      - name: Check Gaussian resources
        run: python scripts/create-gs-assets.py --check
      - name: Validate packaged build payload (no Rhino or Yak installation)
        run: python scripts/package.py --platform ${{ matrix.platform }} --stage-only
